services:
  # Optional: PostgreSQL with pgvector for when you scale up from SQLite
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doc_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docuser
      POSTGRES_PASSWORD: docpassword
      POSTGRES_DB: docdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional: Redis for background task queues
  redis:
    image: redis:7-alpine
    container_name: doc_platform_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
